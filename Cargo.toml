[package]
name = "overtone"
description = "Theme engine and mod layer for the Spotify desktop client"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/booomxd/overtone"

[dependencies]
serde_json = "1"
# Plain sockets only: the DevTools endpoint is local and unencrypted.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
