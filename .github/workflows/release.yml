name: release

# Publishing a release (for example `gh release create v0.2.0 --generate-notes`)
# builds overtone.exe and attaches it. The release itself is created by you,
# so GitHub shows you as its author.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Attach
        shell: bash
        run: |
          cp target/release/overtone.exe .
          sha256sum overtone.exe > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" overtone.exe SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
