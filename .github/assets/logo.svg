    <path d="M20 70 C 27 52, 33 52, 40 70 S 53 88, 60 70 S 73 52, 80 70 S 93 88, 100 70 S 113 52, 120 70 S 133 88, 140 70" stroke-width="2.5" opacity=".45"/>
  </g>
